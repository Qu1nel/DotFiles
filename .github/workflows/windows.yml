name: Windows

on:
  push:
    paths:
      - 'nvim/**'
      - 'scripts/windows/**'
      - 'tests/windows/**'
      - 'tests/nvim/**'
      - '.githooks/**'
      - '.gitattributes'
      - '.github/workflows/windows.yml'
  pull_request:
    paths:
      - 'nvim/**'
      - 'scripts/windows/**'
      - 'tests/windows/**'
      - 'tests/nvim/**'
      - '.githooks/**'
      - '.gitattributes'
      - '.github/workflows/windows.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        shell: [powershell, pwsh]
    defaults:
      run:
        shell: ${{ matrix.shell }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Prepare the pinned Neovim runtime
        run: |
          $prepared = @(./nvim/windows/setup.ps1 -PrepareOnly -Root "$env:RUNNER_TEMP/dotfiles-nvim" | Where-Object {
            $_ -is [pscustomobject] -and $_.PSObject.Properties['NeovimPath']
          })[-1]
          if (-not $prepared -or -not (Test-Path -LiteralPath $prepared.NeovimPath)) {
            throw 'Setup did not return a prepared Neovim runtime.'
          }
          "NVIM_PATH=$($prepared.NeovimPath)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Check source and workflow
        run: |
          $nvim = $env:NVIM_PATH
          ./scripts/windows/check.ps1 -NvimPath $nvim
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ./tests/windows/workflow.Tests.ps1 -NvimPath $nvim
      - name: Check installation
        run: ./tests/windows/install.Tests.ps1
      - name: Check bootstrap failure cases
        run: ./tests/windows/setup.Tests.ps1
      - name: Collect editor logs on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: editor-logs-${{ matrix.shell }}
          path: |
            ${{ runner.temp }}/dotfiles-nvim/**/lsp.log
            ${{ runner.temp }}/dotfiles-nvim/**/nvim.log
            ${{ runner.temp }}/dotfiles-nvim/**/log
          if-no-files-found: ignore
          retention-days: 7
